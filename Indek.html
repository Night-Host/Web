<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divisi Fantasy - Naga</title>
<link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at top, #0b0a0f, #1a1a2e);
    font-family: 'MedievalSharp', cursive;
    color: #f5f3ce;
    overflow-x: hidden;
    padding-top: 70px;
    scroll-behavior: smooth;
  }

  /* Navigation titik 3 */
  nav {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;
  }

  .menu-btn {
    background: linear-gradient(45deg, #ff6f61, #ffcc33, #a64ca6);
    border:none;
    border-radius:50%;
    width:50px; height:50px;
    font-size:28px; color:#fff;
    cursor:pointer;
    box-shadow: 0 0 15px #ff6f61, 0 0 25px #a64ca6;
    transition: 0.3s;
  }
  .menu-btn:hover {
    transform: scale(1.1) rotate(-5deg);
    box-shadow: 0 0 25px #ff6f61, 0 0 35px #a64ca6, 0 0 50px #ffcc33;
  }

  .dropdown {
    position:absolute;
    top:60px;
    right:0;
    background: rgba(20,10,10,0.95);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    display:none;
    flex-direction: column;
    min-width: 180px;
    border: 2px solid #ff6f61;
    box-shadow: 0 0 20px #ff6f61;
  }
  .dropdown button {
    background:none;
    border:none;
    color:#f5f3ce;
    text-align:left;
    padding:12px 16px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
  }
  .dropdown button:hover {
    background: linear-gradient(90deg, #ff6f61, #a64ca6);
    color:#fff;
    border-radius:6px;
    box-shadow:0 0 10px #ffcc33;
  }

  /* Sections */
  section {
    min-height: 80vh;
    display: none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    padding:40px 20px;
    position: relative;
    animation: fadeIn 1s forwards;
  }
  section.active { display:flex; }

  @keyframes fadeIn { 0% {opacity:0; transform: translateY(50px);} 100% {opacity:1; transform: translateY(0);} }

  /* Card style fantasy scroll */
  .card {
    background: rgba(30,10,0,0.7);
    border: 2px solid #ffcc33;
    border-radius: 12px;
    padding:20px;
    margin:15px;
    width:280px;
    box-shadow: 0 0 20px #ff6f61;
    animation: float 3s infinite ease-in-out;
    text-align:center;
  }
  @keyframes float { 0%,100%{transform: translateY(0);}50%{transform: translateY(-10px);} }

  img { width:100%; border-radius:10px; margin-bottom:12px; border:2px solid #a64ca6; }

  h1,h2 { margin-bottom:15px; color:#ffcc33; text-shadow: 0 0 8px #ff6f61; }
  p { font-size:16px; line-height:1.5; color:#f5f3ce; text-shadow:0 0 4px #a64ca6; }

  .list-container { display:flex; flex-wrap:wrap; justify-content:center; }
  .list-card {
    background: rgba(30,10,0,0.7);
    border:2px solid #a64ca6;
    border-radius:12px;
    padding:12px;
    margin:8px;
    width:200px;
    box-shadow:0 0 12px #ff6f61;
    transition:0.3s;
  }
  .list-card:hover { transform: scale(1.05); box-shadow:0 0 20px #ffcc33; }

  .gallery { display:flex; flex-wrap:wrap; justify-content:center; }
  .gallery img { width:180px; margin:10px; border:2px solid #ff6f61; border-radius:10px; transition:0.3s; }
  .gallery img:hover { transform:scale(1.1); border-color:#a64ca6; box-shadow:0 0 10px #ffcc33; }

  /* Floating magical particles */
  .particle {
    position:absolute;
    width:6px; height:6px;
    background: radial-gradient(circle, #ff6f61, #ffcc33);
    border-radius:50%;
    animation: drift 4s infinite linear;
    opacity:0.7;
  }
  @keyframes drift { 0%{transform:translateY(0) translateX(0);} 100%{transform:translateY(-100vh) translateX(50px);} }

</style>
</head>
<body>

<!-- Navigation -->
<nav>
  <button class="menu-btn" onclick="toggleMenu()">⋮</button>
  <div class="dropdown" id="dropdownMenu">
    <button onclick="showSection('profil')">Foto Profil</button>
    <button onclick="showSection('tentang')">Tentang Divisi</button>
    <button onclick="showSection('proyek')">Proyek Zenith</button>
    <button onclick="showSection('galeri')">Galeri</button>
    <button onclick="showSection('murid')">List Murid</button>
  </div>
</nav>

<!-- Sections -->
<section id="profil" class="active">
  <h1>Foto Profil</h1>
  <div class="card">
    <img src="img/foto1.jpg" alt="Profil 1">
    <h2>Nama Member</h2>
    <p>Deskripsi singkat member.</p>
  </div>
</section>

<section id="tentang">
  <h1>Tentang Divisi</h1>
  <p>Divisi </p>
</section>

<section id="proyek">
  <h1>Proyek Zenith</h1>
  <div class="card">
    <h2>Proyek A</h2>
    <p>Deskripsi proyek magis yang telah dibuat di Zenith.</p>
  </div>
  <div class="card">
    <h2>Proyek B</h2>
    <p>Deskripsi proyek lainnya dengan aura naga.</p>
  </div>
</section>

<section id="galeri">
  <h1>Galeri</h1>
  <div class="gallery">
    <img src="https://via.placeholder.com/200x200.png?text=Foto+1">
    <img src="https://via.placeholder.com/200x200.png?text=Foto+2">
    <img src="https://via.placeholder.com/200x200.png?text=Foto+3">
    <img src="https://via.placeholder.com/200x200.png?text=Foto+4">
  </div>
</section>

<section id="murid">
  <h1>List Murid</h1>
  <div class="list-container">
    <div class="list-card">Murid 1</div>
    <div class="list-card">Murid 2</div>
    <div class="list-card">Murid 3</div>
    <div class="list-card">Murid 4</div>
    <div class="list-card">Murid 5</div>
  </div>
</section>

<!-- Magical floating particles -->
<div id="particles"></div>

<script>
  function showSection(id) {
    document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    document.getElementById('dropdownMenu').style.display = 'none';
    window.scrollTo({ top:0, behavior:'smooth' });
  }

  function toggleMenu() {
    const menu = document.getElementById('dropdownMenu');
    menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
  }

  window.addEventListener('click', function(e) {
    const menu = document.getElementById('dropdownMenu');
    const btn = document.querySelector('.menu-btn');
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.style.display = 'none';
    }
  });

  // Generate magical particles
  const particlesContainer = document.getElementById('particles');
  for(let i=0;i<30;i++){
    const p = document.createElement('div');
    p.classList.add('particle');
    p.style.left = Math.random()*100 + 'vw';
    p.style.top = Math.random()*100 + 'vh';
    p.style.width = p.style.height = Math.random()*6 + 4 + 'px';
    particlesContainer.appendChild(p);
  }
</script>

</body>
</html>
